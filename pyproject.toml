[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghana-audiodit"
version = "0.1.0"
description = "Text-to-speech for 43 Ghanaian languages, fine-tuned from LongCat-AudioDiT-1B"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ghana Open AI" }]
dependencies = [
    "torch>=2.1",
    "transformers>=5.3.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "einops>=0.8",
    "sentencepiece",
    "africa-g2p>=0.3.2",
    "pyspellchecker>=0.8",    # turns on africa-g2p's English-word skip (required)
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "sherpa-onnx>=1.12"]
train = ["peft>=0.11", "accelerate", "tensorboard", "pyyaml", "pyarrow", "tqdm", "sherpa-onnx>=1.12", "wordfreq"]

[project.urls]
Model = "https://huggingface.co/ghanaopenai/ghana-audiodit"
Demo = "https://huggingface.co/spaces/ghanaopenai/ghana-audiodit"

[tool.setuptools.packages.find]
include = ["ghana_audiodit*"]
